[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7",
    "pydantic>=2,<3",
    "tqdm>=4",
]

[dependency-groups]
dev = ["flake8>=7", "mypy>=1.10"]

[tool.mypy]
exclude = ["^data/", "^moulinette/"]

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true
